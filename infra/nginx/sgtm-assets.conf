# Server-side GTM + stealth GTM.js loader for assets.yourimpactdev.com
#
# Install:
#   sudo cp infra/nginx/sgtm-assets.conf /etc/nginx/sites-available/assets.yourimpactdev.com
#   sudo ln -sf /etc/nginx/sites-available/assets.yourimpactdev.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d assets.yourimpactdev.com
#
# DNS: A record assets.yourimpactdev.com → VPS IP (72.62.6.143)

server {
    listen 80;
    listen [::]:80;
    server_name assets.yourimpactdev.com;

    # Resolve googletagmanager.com for proxy_pass
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Stealth GTM.js loader (id injected server-side)
    location = /moondance {
        rewrite ^ /gtm.js?id=GTM-TGJBL7R7 break;
        proxy_pass https://www.googletagmanager.com;
        proxy_set_header Host www.googletagmanager.com;
        proxy_ssl_server_name on;
    }

    # Stealth noscript iframe fallback (?id=GTM-xxx preserved)
    location = /moondance-ns {
        rewrite ^ /ns.html$is_args$args break;
        proxy_pass https://www.googletagmanager.com;
        proxy_set_header Host www.googletagmanager.com;
        proxy_ssl_server_name on;
    }

    # sGTM container (Docker on 127.0.0.1:8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
