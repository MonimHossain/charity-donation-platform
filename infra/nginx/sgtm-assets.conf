# Server-side GTM + stealth GTM.js loader for assets.yourimpactdev.com
#
# Install:
#   sudo bash scripts/setup-sgtm.sh
#   # or manually copy this file to /etc/nginx/sites-available/assets.yourimpactdev.com
#
# DNS: A record assets.yourimpactdev.com → VPS IP

map $server_port $sgtm_forwarded_proto {
    443     https;
    default $scheme;
}

map $args $moondance_gtm_query {
    ""      "id=GTM-WJWFZW62";
    default "id=GTM-WJWFZW62&$args";
}

server {
    listen 80;
    listen [::]:80;
    server_name assets.yourimpactdev.com;

    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;
    large_client_header_buffers 8 32k;

    # HTTPS security headers on the edge (certbot usually adds listen 443 to this server).
    include /etc/nginx/includes/security-headers.conf;

    # Stealth GTM.js — must forward gtm_preview / gtm_auth (GTM Preview 400 if stripped).
    location = /moondance {
        rewrite ^ /gtm.js?$moondance_gtm_query break;
        proxy_pass https://www.googletagmanager.com;
        proxy_set_header Host www.googletagmanager.com;
        proxy_ssl_server_name on;
    }

    location = /moondance-ns {
        rewrite ^ /ns.html$is_args$args break;
        proxy_pass https://www.googletagmanager.com;
        proxy_set_header Host www.googletagmanager.com;
        proxy_ssl_server_name on;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sgtm_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }
}
