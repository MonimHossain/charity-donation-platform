# Nginx reverse proxy for production VPS.
# Install once on the server (survives Jenkins deploys):
#   sudo mkdir -p /etc/nginx/includes /etc/nginx/conf.d
#   sudo cp infra/nginx/conf.d/security-headers-map.conf /etc/nginx/conf.d/
#   sudo cp infra/nginx/includes/security-headers.conf /etc/nginx/includes/
#   sudo cp infra/nginx/production.conf /etc/nginx/sites-available/your-impact
#   sudo ln -sf /etc/nginx/sites-available/your-impact /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 443/tcp
#   sudo bash scripts/setup-domain-ssl.sh
#
# MinIO stays on 127.0.0.1:9002 (docker-compose). Browsers load images via /charity-media/.

server {
    listen 80;
    listen [::]:80;
    server_name yourimpactdev.com www.yourimpactdev.com;

    client_max_body_size 50M;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/includes/security-headers.conf;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
    }

    location ^~ /charity-media/ {
        proxy_pass http://127.0.0.1:9002/charity-media/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        include /etc/nginx/includes/security-headers.conf;
    }
}
